<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Editor — BlogApp</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Marked.js CDN for live markdown preview -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        BlogApp <span class="logo-badge">IN2120</span>
      </a>
      <div id="nav-right" class="nav-links">
        <!-- Dynamically populated by auth.js -->
      </div>
    </div>
  </nav>

  <!-- Editor Container -->
  <main class="container">
    <div class="post-detail" style="max-width: 900px;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h1 id="editor-heading" style="font-family: var(--font-heading); font-size: 2rem; color: #fff;">
          Create New Blog Post
        </h1>
        <a href="index.html" class="btn btn-secondary btn-sm">Cancel</a>
      </div>

      <div id="alert-box"></div>

      <form id="editor-form">
        <div class="form-group">
          <label class="form-label" for="title">Blog Title</label>
          <input type="text" id="title" class="form-control" placeholder="Enter a descriptive title..." required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label class="form-label" style="margin-bottom: 0;">Content (Markdown Supported)</label>
            <div class="editor-tabs" style="margin-bottom: 0; padding-bottom: 0; border: none;">
              <button type="button" id="tab-write" class="tab-btn active">Write</button>
              <button type="button" id="tab-preview" class="tab-btn">Preview</button>
            </div>
          </div>

          <!-- Write Panel -->
          <div id="panel-write">
            <textarea id="content" class="form-control" style="min-height: 320px; font-family: 'Inter', monospace; line-height: 1.6;" placeholder="Write your post content using Markdown syntax (e.g. ## Heading, **bold**, - list)..." required></textarea>
          </div>

          <!-- Live Preview Panel -->
          <div id="panel-preview" class="markdown-body" style="display: none; min-height: 320px; padding: 1.25rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md);">
            <p style="color: var(--text-muted);">Nothing to preview yet.</p>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
          <a href="index.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" id="submit-btn" class="btn btn-primary">
            Publish Post
          </button>
        </div>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 BlogApp — IN2120 Web Programming Coursework</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
