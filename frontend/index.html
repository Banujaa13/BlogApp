<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogApp </title>
  <meta name="description"
    content="A multi-user blog application built with PHP, MySQL, HTML, CSS, and JS .">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        BlogApp
      </a>
      <div id="nav-right" class="nav-links">
        <!-- Dynamically populated by auth.js -->
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container">

    <!-- Hero Section -->
    <section class="hero-section">
      <h1 class="hero-title">Discover Tech & Academic Insights</h1>
      <p class="hero-subtitle">
        A platform for students and faculty to publish, read, and engage with articles. Built for University of Moratuwa
        coursework.
      </p>
    </section>

    <!-- Posts Container Grid -->
    <div id="posts-container" class="posts-grid">
      <div class="empty-state" style="grid-column: 1 / -1;">
        <p>Loading blog posts...</p>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 BlogApp </p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/home.js"></script>
</body>

</html>
