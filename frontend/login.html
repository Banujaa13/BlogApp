<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BlogApp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <nav class="navbar" aria-label="Main navigation">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon" aria-hidden="true">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </span>
        BlogApp
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">&larr; Back to Home</a>
      </div>
    </div>
  </nav>

  <main id="main-content" class="container auth-page">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-icon" aria-hidden="true">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to manage your posts and publish new articles.</p>
      </div>

      <div id="alert-box" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login_id">Email or Username</label>
          <input type="text" id="login_id" name="login_id" class="form-control"
            placeholder="e.g. banujaa or banujaa@example.com" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input type="password" id="password" name="password" class="form-control"
              placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="input-toggle" data-toggle-password="password" aria-label="Show password">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 0.35rem;">
          Sign In
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one for free</a>
      </p>
    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const alertBox = document.getElementById('alert-box');
      const submitBtn = document.getElementById('submit-btn');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.innerHTML = '';

        const login_id = document.getElementById('login_id').value.trim();
        const password = document.getElementById('password').value;

        if (!login_id || !password) {
          alertBox.innerHTML = `<div class="alert alert-danger">Please fill in all fields to continue.</div>`;
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          const response = await fetch('../backend/api/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login_id, password })
          });
          const data = await response.json();

          if (data.success) {
            alertBox.innerHTML = `<div class="alert alert-success">${escapeHTML(data.message)} Redirecting...</div>`;
            setTimeout(() => { window.location.href = 'index.html'; }, 800);
          } else {
            alertBox.innerHTML = `<div class="alert alert-danger">${escapeHTML(data.message)}</div>`;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
          }
        } catch (err) {
          console.error(err);
          alertBox.innerHTML = `<div class="alert alert-danger">Unable to connect to the server. Please ensure XAMPP is running.</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
