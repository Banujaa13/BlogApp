<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Post — BlogApp</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Marked.js CDN for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        BlogApp
      </a>
      <div id="nav-right" class="nav-links">
        <!-- Dynamically populated by auth.js -->
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <div style="margin-bottom: 1.5rem;">
      <a href="index.html" class="btn btn-secondary btn-sm">&larr; Back to All Posts</a>
    </div>

    <div id="alert-box"></div>

    <article id="post-container" class="post-detail">
      <div class="empty-state">
        <p>Loading blog post content...</p>
      </div>
    </article>
  </main>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay">
    <div class="modal">
      <h3 style="font-family: var(--font-heading); font-size: 1.35rem; color: #fff; margin-bottom: 0.75rem;">
        Confirm Delete
      </h3>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
        Are you sure you want to delete this blog post? This action cannot be undone.
      </p>
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
        <button id="cancel-delete-btn" class="btn btn-secondary btn-sm">Cancel</button>
        <button id="confirm-delete-btn" class="btn btn-danger btn-sm">Yes, Delete Post</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 BlogApp </p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
