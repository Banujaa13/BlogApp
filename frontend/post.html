<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — BlogApp</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <nav class="navbar" aria-label="Main navigation">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon" aria-hidden="true">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </span>
        BlogApp
      </a>
      <div id="nav-right" class="nav-links"></div>
    </div>
  </nav>

  <main id="main-content" class="container container-narrow">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep" aria-hidden="true">/</span>
      <span id="breadcrumb-current">Article</span>
    </nav>

    <div id="alert-box" role="alert" aria-live="polite"></div>

    <article id="post-container" class="post-detail" aria-live="polite">
      <div class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading article...</p>
      </div>
    </article>
  </main>

  <div id="delete-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
    <div class="modal">
      <div class="modal-icon" aria-hidden="true">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </div>
      <h3 id="delete-modal-title" class="modal-title">Delete this article?</h3>
      <p class="modal-text">This action is permanent and cannot be undone. Your article will be removed from the public feed immediately.</p>
      <div class="modal-actions">
        <button id="cancel-delete-btn" class="btn btn-secondary btn-sm">Keep Article</button>
        <button id="confirm-delete-btn" class="btn btn-danger btn-sm">Yes, Delete</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2026 BlogApp · Submitted by <strong>Banujaa (245013X)</strong></p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="editor.html">Write</a>
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
